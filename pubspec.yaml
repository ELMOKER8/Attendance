name: attendance
description: "A production-ready offline Flutter student attendance client for isolated Wi-Fi intranets."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^5.1.1
  http: ^1.2.1
  shared_preferences: ^2.2.3
  device_info_plus: ^10.1.0
  flutter_secure_storage: ^9.2.2
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
